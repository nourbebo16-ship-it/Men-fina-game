<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مين فينا؟</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
font-family:Arial,Tahoma,sans-serif;
background:linear-gradient(135deg,#100b2d,#4c1d95,#be185d);
color:#fff;
}

.app{
width:min(100%,560px);
margin:auto;
padding:18px;
}

.screen{
display:none;
min-height:calc(100vh - 36px);
align-content:center;
}

.screen.active{
display:grid;
animation:show .3s ease;
}

@keyframes show{
from{opacity:0;transform:translateY(12px)}
to{opacity:1;transform:none}
}

.logo{
text-align:center;
font-size:clamp(48px,14vw,75px);
font-weight:900;
}

.sub{
text-align:center;
color:#ddd;
line-height:1.7;
margin:5px 0 22px;
}

.card{
background:rgba(0,0,0,.28);
border:1px solid rgba(255,255,255,.14);
border-radius:25px;
padding:22px;
box-shadow:0 18px 50px #0005;
}

h2{
font-size:18px;
margin:4px 0 12px;
}

.grid2{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

button{
border:1px solid #ffffff18;
background:#191532;
color:white;
border-radius:15px;
padding:15px;
font-size:16px;
font-weight:800;
cursor:pointer;
transition:.15s;
}

button:active{
transform:scale(.97);
}

button.selected{
background:#7c3aed;
border-color:#c4b5fd;
}

.start{
width:100%;
border:0;
background:linear-gradient(135deg,#7c3aed,#ec4899);
font-size:19px;
margin-top:20px;
}

.levels{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.level{
text-align:right;
}

.level small{
display:block;
color:#bbb;
margin-top:5px;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
font-weight:800;
margin-bottom:10px;
}

.back{
padding:8px 12px;
font-size:13px;
}

.progress{
height:8px;
background:#ffffff22;
border-radius:20px;
overflow:hidden;
margin-bottom:18px;
}

.bar{
height:100%;
width:0;
background:#fff;
transition:.3s;
}

.badge{
display:inline-block;
background:#7c3aed;
padding:7px 12px;
border-radius:99px;
font-size:12px;
font-weight:900;
}

.question{
text-align:center;
font-size:clamp(26px,7vw,38px);
line-height:1.5;
margin:22px 0;
}

.answers{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.answer{
min-height:65px;
background:#111026;
}

.note{
text-align:center;
color:#aaa;
font-size:13px;
margin-top:15px;
}

.result{
text-align:center;
}

.trophy{
font-size:60px;
}

.score{
font-size:58px;
font-weight:900;
margin:5px;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin:20px 0;
}

.stat{
background:#111026;
border-radius:14px;
padding:12px;
}

.stat b{
display:block;
font-size:20px;
}

.stat small{
color:#aaa;
}

.secondary{
width:100%;
margin-top:10px;
}

@media(max-width:390px){
.answers,.levels{
grid-template-columns:1fr;
}
}
</style>
</head>

<body>

<main class="app">

<section id="home" class="screen active">

<div class="logo">مين فينا؟</div>

<p class="sub">
اختاروا مين ينطبق عليه السؤال 🔥<br>
وخلّوا الجولة تكشف مين أكتر واحد!
</p>

<div class="card">

<h2>عدد أسئلة الجولة</h2>

<div class="grid2">

<button class="count selected" data-count="6">
6 أسئلة
</button>

<button class="count" data-count="10">
10 أسئلة
</button>

</div>

<h2 style="margin-top:22px">
اختار المرحلة
</h2>

<div class="levels">

<button class="level selected" data-level="1">
🟢 المستوى 1
<small>أسئلة خفيفة</small>
</button>

<button class="level" data-level="2">
🟡 المستوى 2
<small>محتاج تفكير</small>
</button>

<button class="level" data-level="3">
🟠 المستوى 3
<small>صعب</small>
</button>

<button class="level" data-level="4">
🔴 المستوى 4
<small>تحدي</small>
</button>

<button class="level" data-level="5">
🔥 المستوى 5
<small>أسطوري</small>
</button>

</div>

<button class="start" id="start">
ابدأ الجولة 🚀
</button>

</div>

</section>


<section id="game" class="screen">

<div class="top">

<button class="back" id="quit">
خروج
</button>

<span id="progressText">
1 / 6
</span>

<strong id="roundPoints">
0 نقطة
</strong>

</div>

<div class="progress">

<div class="bar" id="bar"></div>

</div>

<div class="card">

<div style="text-align:center">

<span class="badge" id="badge">
سهل
</span>

</div>

<div class="question" id="question"></div>

<div class="answers" id="answers"></div>

<div class="note">
النتيجة مش هتظهر غير في نهاية الجولة 👀
</div>

</div>

</section>


<section id="result" class="screen">

<div class="card result">

<div class="trophy">
🏆
</div>

<h1>
خلصت الجولة!
</h1>

<div class="score" id="finalScore">
0
</div>

<p id="message"></p>

<div class="stats">

<div class="stat">
<b id="statQuestions">0</b>
<small>أسئلة</small>
</div>

<div class="stat">
<b id="statLevel">1</b>
<small>المستوى</small>
</div>

<div class="stat">
<b id="statBest">0</b>
<small>أفضل نتيجة</small>
</div>

</div>

<button class="start" id="again">
🔄 جولة جديدة
</button>

<button class="secondary" id="home">
🏠 الرئيسية
</button>

</div>

</section>

</main>


<script>

/* =========================
   إعداد اللعبة
========================= */

let count = 6;
let level = 1;
let round = [];
let current = 0;
let score = 0;


/* =========================
   بنك الأسئلة
========================= */

const QUESTIONS = [

/* المستوى 1 */

{
level:1,
text:"مين فينا أكتر واحد بيتأخر على المواعيد؟",
answers:["أنا","إنت","الاتنين","ولا واحد"]
},

{
level:1,
text:"مين فينا بيحب النوم أكتر؟",
answers:["أنا","إنت","الاتنين","ولا واحد"]
},

{
level:1,
text:"مين فينا بيحب الأكل أكتر؟",
answers:["أنا","إنت","الاتنين","ولا واحد"]
},

{
level:1,
text:"مين فينا بيضحك أسرع؟",
answers:["أنا","إنت","الاتنين","ولا واحد"]
},

{
level:1,
text:"مين فينا بيسهر أكتر؟",
answers:["أنا","إنت","الاتنين","ولا واحد"]
},

{
level:1,
text:"مين فينا بينسى حاجته أكتر؟",
answers:["أنا","إنت","الاتنين","ولا واحد"]
},

{
level:1,
text:"مين فينا بيرد على الرسائل أسرع؟",
answers:["أنا","إنت","الاتنين","ولا واحد"]
},

{
level:1,
text:"مين فينا ممكن يطلب أكل وهو لسه واكل؟",
answers:["أنا","إنت","الاتنين","ولا واحد"]
},


/* المستوى 2 */

{
level:2,
text:"مين فينا لو كسب فلوس فجأة هيصرفها أسرع؟",
answers:["أنا","إنت","الاتنين","حسب المبلغ"]
},

{
level:2,
text:"مين فينا ممكن يغير رأيه أسرع؟",
answers:["أنا","إنت","الاتنين","حسب الموضوع"]
},

{
level:2,
text:"مين فينا يقدر يحفظ سر لفترة أطول؟",
answers:["أنا","إنت","الاتنين","مش مضمون"]
},

{
level:2,
text:"مين فينا ممكن يبدأ مشروع ويزهق منه؟",
answers:["أنا","إنت","الاتنين","ولا واحد"]
},

{
level:2,
text:"مين فينا ممكن يسافر من غير خطة؟",
answers:["أنا","إنت","الاتنين","حسب المكان"]
},

{
level:2,
text:"مين فينا يشتري حاجة مش محتاجها عشان عليها خصم؟",
answers:["أنا","إنت","الاتنين","ولا واحد"]
},


/* المستوى 3 */

{
level:3,
text:"مين فينا ممكن يقول الحقيقة حتى لو هتعمل مشكلة؟",
answers:["أنا","إنت","الاتنين","حسب الموقف"]
},

{
level:3,
text:"مين فينا أصعب في الاعتذار حتى لو غلطان؟",
answers:["أنا","إنت","الاتنين","ولا واحد"]
},

{
level:3,
text:"مين فينا ممكن يضحي بمصلحته عشان صاحبه؟",
answers:["أنا","إنت","الاتنين","مش دايمًا"]
},

{
level:3,
text:"مين فينا لو فشل هيرجع يحاول تاني؟",
answers:["أنا","إنت","الاتنين","حسب الفشل"]
},

{
level:3,
text:"مين فينا بيقدر يفضل هادي وقت الخناقة؟",
answers:["أنا","إنت","الاتنين","ولا واحد"]
},

{
level:3,
text:"مين فينا أصعب في تغيير رأيه؟",
answers:["أنا","إنت","الاتنين","ولا واحد"]
},


/* المستوى 4 */

{
level:4,
text:"مين فينا ممكن يرفض فرصة ممتازة لو ضد مبادئه؟",
answers:["أنا","إنت","الاتنين","حسب الفرصة"]
},

{
level:4,
text:"مين فينا ممكن يغير حياته بقرار واحد؟",
answers:["أنا","إنت","الاتنين","ولا واحد"]
},

{
level:4,
text:"مين فينا ممكن يكسب نقاش وهو مش الصح؟",
answers:["أنا","إنت","الاتنين","الاتنين ممكن"]
},

{
level:4,
text:"مين فينا يقدر يخبي مشاعره أحسن؟",
answers:["أنا","إنت","الاتنين","ولا واحد"]
},

{
level:4,
text:"مين فينا ممكن يختار الحقيقة على راحته؟",
answers:["أنا","إنت","الاتنين","حسب الحقيقة"]
},

{
level:4,
text:"مين فينا ممكن يقطع علاقة لو الثقة راحت؟",
answers:["أنا","إنت","الاتنين","حسب العلاقة"]
},


/* المستوى 5 */

{
level:5,
text:"مين فينا ممكن يختار خسارة النهارده عشان يكسب بعد سنة؟",
answers:["أنا","إنت","الاتنين","ولا واحد"]
},

{
level:5,
text:"مين فينا ممكن يواجه الكل لو شايفهم غلط؟",
answers:["أنا","إنت","الاتنين","حسب الموضوع"]
},

{
level:5,
text:"مين فينا أصعب شخص تتوقع رد فعله؟",
answers:["أنا","إنت","الاتنين","الاتنين"]
},

{
level:5,
text:"مين فينا ممكن يضحي بفرصة كبيرة عشان شخص مهم؟",
answers:["أنا","إنت","الاتنين","حسب الشخص"]
},

{
level:5,
text:"مين فينا ممكن يبدأ من الصفر لو فقد كل حاجة؟",
answers:["أنا","إنت","الاتنين","ولا واحد"]
},

{
level:5,
text:"مين فينا ممكن يحتفظ بسر كبير سنين؟",
answers:["أنا","إنت","الاتنين","مش مضمون"]
}

];


/* =========================
   أدوات
========================= */

function shuffle(array){

return [...array].sort(
()=>Math.random()-0.5
);

}


function showScreen(id){

document
.querySelectorAll(".screen")
.forEach(screen=>{
screen.classList.remove("active");
});

document
.getElementById(id)
.classList.add("active");

}


/* =========================
   اختيار عدد الأسئلة
========================= */

document
.querySelectorAll(".count")
.forEach(button=>{

button.addEventListener("click",()=>{

document
.querySelectorAll(".count")
.forEach(x=>{
x.classList.remove("selected");
});

button.classList.add("selected");

count =
Number(button.dataset.count);

});

});


/* =========================
   اختيار المستوى
========================= */

document
.querySelectorAll(".level")
.forEach(button=>{

button.addEventListener("click",()=>{

document
.querySelectorAll(".level")
.forEach(x=>{
x.classList.remove("selected");
});

button.classList.add("selected");

level =
Number(button.dataset.level);

});

});


/* =========================
   بداية الجولة
========================= */

function startGame(){

let pool =
QUESTIONS.filter(
question=>question.level<=level
);


/*
كلما زاد المستوى،
نزود نسبة الأسئلة من نفس المستوى.
*/

let exact =
shuffle(
pool.filter(
question=>question.level===level
)
);

let lower =
shuffle(
pool.filter(
question=>question.level<level
)
);


let exactCount =
Math.ceil(count*0.7);


round =
[
...exact.slice(0,exactCount),
...lower
];


if(round.length<count){

round =
shuffle(pool);
}


round =
shuffle(round).slice(0,count);


current=0;
score=0;

showScreen("game");

showQuestion();

}


/* =========================
   عرض السؤال
========================= */

function showQuestion(){

let question =
round[current];

let difficulty =
[
"",
"سهل",
"متوسط",
"صعب",
"تحدي",
"أسطوري"
];


document
.getElementById("progressText")
.textContent =
`السؤال ${current+1} / ${round.length}`;


document
.getElementById("roundPoints")
.textContent =
`${score} نقطة`;


document
.getElementById("bar")
.style.width =
`${current/round.length*100}%`;


document
.getElementById("badge")
.textContent =
difficulty[question.level];


document
.getElementById("question")
.textContent =
question.text;


let answers =
document.getElementById("answers");


answers.innerHTML="";


shuffle(question.answers)
.forEach(answer=>{

let button =
document.createElement("button");

button.className="answer";

button.textContent=answer;

button.addEventListener(
"click",
()=>{
answerQuestion(question)
}
);

answers.appendChild(button);

});

}


/* =========================
   الإجابة
========================= */

function answerQuestion(question){

/*
النقاط مخفية حتى نهاية الجولة.
*/

score += question.level * 10;

current++;


if(current>=round.length){

finishGame();

}else{

showQuestion();

}

}


/* =========================
   النتيجة
========================= */

function finishGame(){

document
.getElementById("bar")
.style.width="100%";


let best =
Number(
localStorage.getItem("menFinaBest") || 0
);


if(score>best){

localStorage.setItem(
"menFinaBest",
score
);

best=score;

}


document
.getElementById("finalScore")
.textContent =
`${score} نقطة`;


document
.getElementById("statQuestions")
.textContent =
round.length;


document
.getElementById("statLevel")
.textContent =
level;


document
.getElementById("statBest")
.textContent =
best;


let message;

if(level===5){

message="🔥 أسطوري! وصلت لأعلى مستوى.";

}else if(level===4){

message="😈 قوي جدًا! جاهز للأسطوري؟";

}else if(level===3){

message="🔥 ممتاز! لسه في مستويات أصعب.";

}else if(level===2){

message="👏 كويس جدًا! جرب مستوى أعلى.";

}else{

message="😎 بداية حلوة! ارفع المستوى.";

}


document
.getElementById("message")
.textContent =
message;


showScreen("result");

}


/* =========================
   الأزرار
========================= */

document
.getElementById("start")
.addEventListener(
"click",
startGame
);


document
.getElementById("again")
.addEventListener(
"click",
startGame
);


document
.getElementById("home")
.addEventListener(
"click",
()=>{
showScreen("home");
}
);


document
.getElementById("quit")
.addEventListener(
"click",
()=>{
showScreen("home");
}
);
alert("JavaScript شغال ✅");
</script>

</body>
  </html>
